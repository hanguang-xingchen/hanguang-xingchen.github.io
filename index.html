<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hanguang Xingchen</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="css/style.css" />

            <!-- Thinking -->

                            <line x1="7" y1="17" x2="17" y2="7" />
                            <polyline points="7 7 17 7 17 17" />
                        </svg>

                </div>
                <div class="thinking-list" id="thinkingList">

                </div>

            <footer class="footer">
                <span>Designed by Hanguang & Qwen & DeepSeek, based on <a href="https://enashpinal.friends.hanguangxingchen.top/" target="_blank">ena-qwq</a></span>
                <span class="footer-center" id="update-time">数据最后更新于 -- 分钟前</span>
                <a href="https://github.com/hanguang-xingchen/hanguang-xingchen.github.io" target="_blank">Source on GitHub</a>
            </footer>

    <script>
        const GITHUB_USERNAME = 'hanguang-xingchen';
        const CACHE_TTL = 15 * 60 * 1000; // 15 分钟

        // ===== 加载个人信息 =====
        async function loadBasis() {
            try {
                const res = await fetch('/info/basis.json');
                const data = await res.json();
                document.getElementById('sidebarName').textContent = data.name;
                document.getElementById('sidebarBio').textContent = data.bio;
                document.getElementById('infoLocation').innerHTML = `<strong>位置</strong> ${data.location}`;
                document.getElementById('infoInterests').innerHTML = `<strong>兴趣</strong> ${(data.interests || []).join('，')}`;
                document.title = data.name;
            } catch (e) {
                console.warn('Failed to load basis:', e);
            }
        }

                const grid = document.getElementById('linksGrid');
                const links = data.social || [];

                const icons = {

                    gitea: '<svg viewBox="0 0 24 24" fill="currentColor" style="width:16px;height:16px;margin-right:6px"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.68 13.72L12 14.3l-2.07.72-1.23-.72.35-2.07L7.32 10l.72-1.23 2.07.35L12 7.3l2.07.72.72 1.23-1.72 1.72.35 2.07-1.23.72z"/></svg>',
                    bbs: '<svg viewBox="0 0 24 24" fill="currentColor" style="width:16px;height:16px;margin-right:6px"><path d="M21 6h-2v6H5V6H3v12h2v-2h14v2h2V6zm-4 8H7v-2h10v2zm0-4H7V8h10v2z"/></svg>',
                    qq: '<svg viewBox="0 0 24 24" fill="currentColor" style="width:16px;height:16px;margin-right:6px"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 13.27c-.33.55-.79 1.05-1.33 1.45.13.27.27.58.36.89.09.31.11.55.04.72-.07.17-.23.28-.47.34-.24.06-.51.03-.8-.08-.29-.11-.55-.28-.79-.49-.24.02-.49.03-.74.03s-.5-.01-.74-.03c-.24.21-.5.38-.79.49-.29.11-.56.14-.8.08-.24-.06-.4-.17-.47-.34-.07-.17-.05-.41.04-.72.09-.31.23-.62.36-.89-.54-.4-1-0.9-1.33-1.45-.33-.55-.5-1.12-.5-1.72 0-.73.23-1.4.63-1.95.4-.55.93-.96 1.53-1.18.07-.62.29-1.17.63-1.57.34-.4.78-.65 1.27-.72.07-.39.23-.73.46-1 .23-.27.53-.45.87-.52.16-.03.33-.05.5-.05s.34.02.5.05c.34.07.64.25.87.52.23.27.39.61.46 1 .49.07.93.32 1.27.72.34.4.56.95.63 1.57.6.22 1.13.63 1.53 1.18.4.55.63 1.22.63 1.95 0 .6-.17 1.17-.5 1.72z"/></svg>',
                    email: '<svg viewBox="0 0 24 24" fill="currentColor" style="width:16px;height:16px;margin-right:6px"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>'

        // ===== 加载 SCL-90 =====
        async function loadScl90() {
            try {
                // 清空旧格式缓存
                localStorage.removeItem('scl90_cache');

                const res = await fetch('/info/scl-90-report.json?t=' + Date.now());
                if (!res.ok) throw new Error('Failed to fetch');
                const data = await res.json();
                renderScl90(data);
            } catch (e) {
                document.getElementById('scl90Stats').innerHTML = '<div class="error-text">Failed to load SCL-90 data.</div>';
                console.error('SCL-90 error:', e);
            }
        }

        function renderScl90(data) {
            // 扁平单记录结构：直接用 data 本身
            const latest = data;

            // 日期标签
            document.getElementById('scl90Date').textContent = `Latest: ${latest.date}`;

            // 统计卡片
            const statsEl = document.getElementById('scl90Stats');
            statsEl.innerHTML = `
                <div><div class="stat-value" data-target="${latest.summary.totalScore}">0</div><div class="stat-label">Total Score</div></div>
                <div><div class="stat-value" data-target="${latest.summary.totalMean}">0</div><div class="stat-label">Mean</div></div>
                <div><div class="stat-value" data-target="${latest.summary.positiveItemCount}">0</div><div class="stat-label">Positive Items</div></div>
                <div><div class="stat-value" data-target="${latest.summary.positiveMean}">0</div><div class="stat-label">Positive Mean</div></div>
            `;

            // 数字滚动动画
            setTimeout(() => {
                document.querySelectorAll('.stat-value[data-target]').forEach(el => {
                    const target = parseFloat(el.dataset.target);
                    const isFloat = target % 1 !== 0;
                    const duration = 800;
                    const start = performance.now();
                    function tick(now) {
                        const elapsed = now - start;
                        const progress = Math.min(elapsed / duration, 1);
                        const eased = 1 - Math.pow(1 - progress, 3);
                        const current = target * eased;
                        el.textContent = isFloat ? current.toFixed(2) : Math.round(current);
                        if (progress < 1) requestAnimationFrame(tick);
                    }
                    requestAnimationFrame(tick);
                });
            }, 100);

            // 侧边栏雷达图（SVG，排除"其他"，各维度独立颜色）
            const factorEntries = Object.entries(latest.factors).filter(([name]) => name !== '其他');
            if (factorEntries.length >= 3) {
                drawSvgRadar('sidebarRadar', factorEntries);
            }

            // 侧边栏摘要
            const over = latest.summary.factorOverThreshold;
            document.getElementById('scl90SidebarSummary').innerHTML = `
                <span class="score">${latest.summary.totalScore}</span> pts<br>
                ${over.length > 0 ? `<span class="over">⚠ ${over.join(', ')}</span>` : '<span style="color:var(--green-500)">✓ All normal</span>'}
            `;

            // 主内容区：彩色水平条形图
            const colors = ['#6366f1', '#8b5cf6', '#ec4899', '#f59e0b', '#10b981', '#3b82f6', '#ef4444', '#14b8a6', '#f97316', '#06b6d4'];
            const sorted = Object.entries(latest.factors).sort((a, b) => b[1] - a[1]);
            const factorLabels = sorted.map(([name]) => name);
            const factorData = sorted.map(([, score]) => score);

            const factorCtx = document.getElementById('factorChart').getContext('2d');
            new Chart(factorCtx, {
                type: 'bar',
                data: {
                    labels: factorLabels,
                    datasets: [{
                        data: factorData,
                        backgroundColor: colors.slice(0, factorData.length),
                        borderColor: 'transparent',
                        borderRadius: 0,
                    }]
                },
                options: {
                    indexAxis: 'y',
                    animation: { duration: 1000, easing: 'easeOutQuart', delay: (ctx) => ctx.dataIndex * 80 },
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(ctx) {
                                    return ctx.raw.toFixed(2);
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            min: 0,
                            max: 5,
                            grid: { display: false }
                        },
                        y: {
                            grid: { display: false },
                            ticks: { font: { size: 12, weight: '500' } }
                        }
                    },
                    afterDraw: function(chart) {
                        const ctx = chart.ctx;
                        const meta = chart.getDatasetMeta(0);
                        const total = chart.data.datasets[0].data.reduce((a, b) => a + b, 0);
                        chart.data.datasets[0].data.forEach((value, index) => {
                            const pct = ((value / total) * 100).toFixed(1) + '%';
                            const bar = meta.data[index];
                            ctx.fillStyle = '#6b7280';
                            ctx.font = '12px FusionPixel, PingFang SC, sans-serif';
                            ctx.textAlign = 'left';
                            ctx.textBaseline = 'middle';
                            ctx.fillText(pct, bar.x + 4, bar.y);
                        });
                    }
                }
            });
        }

        // ===== SVG 雷达图（复刻 psyScale 风格） =====
        function drawSvgRadar(containerId, factorEntries) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = '';

            const dims = factorEntries.filter(([name]) => name !== '其他');
            if (dims.length < 3) return;

            const dimensions = dims.map(([name]) => name);
            const values = dims.map(([, score]) => score);
            const n = dimensions.length;

            // 维度名→颜色映射（固定对应，不按序号分配）
            const colorMap = {
                '躯体化': '#f472b6', '焦虑': '#8b5cf6', '强迫': '#ec4899',
                '抑郁': '#f59e0b', '人际敏感': '#10b981', '精神病性': '#3b82f6',
                '偏执': '#ef4444', '敌对': '#14b8a6', '恐怖': '#f97316', '其他': '#06b6d4'
            };
            const colors = dimensions.map(name => colorMap[name] || '#6b7280');

            const size = 240;
            const cx = size / 2;
            const cy = size / 2;
            const maxR = size / 2 - 30;
            const levelCount = 4;
            const minValue = 1;
            const maxValue = 5;
            const angleStep = (2 * Math.PI) / n;
            const startAngle = -Math.PI / 2;

            function radius(level) {
                return (level / levelCount) * maxR;
            }

            function pointCoords(axisIndex, value) {
                const angle = startAngle + axisIndex * angleStep;
                const ratio = (value - minValue) / (maxValue - minValue);
                const r = Math.max(0, ratio) * maxR;
                return {
                    x: cx + r * Math.cos(angle),
                    y: cy + r * Math.sin(angle)
                };
            }

            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('viewBox', `0 0 ${size} ${size}`);
            svg.setAttribute('width', '100%');
            svg.setAttribute('style', 'max-width:240px; display:block; margin:0 auto;');

            // 同心圆参考线
            for (let i = 1; i <= levelCount; i++) {
                const r = radius(i);
                const points = [];
                for (let j = 0; j < n; j++) {
                    const angle = startAngle + j * angleStep;
                    points.push(`${cx + r * Math.cos(angle)},${cy + r * Math.sin(angle)}`);
                }
                const polygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                polygon.setAttribute('points', points.join(' '));
                polygon.setAttribute('fill', 'none');
                polygon.setAttribute('stroke', '#e5e7eb');
                polygon.setAttribute('stroke-width', '1');
                svg.appendChild(polygon);

                // 分值标签
                const val = minValue + (maxValue - minValue) * (i / levelCount);
                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', cx + 2);
                text.setAttribute('y', cy - r + 4);
                text.setAttribute('fill', '#9ca3af');
                text.setAttribute('font-size', '9');
                text.setAttribute('font-family', 'FusionPixel, PingFang SC, sans-serif');
                text.textContent = val.toFixed(1);
                svg.appendChild(text);
            }

            // 轴线和标签
            for (let i = 0; i < n; i++) {
                const angle = startAngle + i * angleStep;
                const endX = cx + maxR * Math.cos(angle);
                const endY = cy + maxR * Math.sin(angle);

                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', cx);
                line.setAttribute('y1', cy);
                line.setAttribute('x2', endX);
                line.setAttribute('y2', endY);
                line.setAttribute('stroke', '#f3f4f6');
                line.setAttribute('stroke-width', '1');
                svg.appendChild(line);

                // 维度标签
                const labelR = maxR + 16;
                const lx = cx + labelR * Math.cos(angle);
                const ly = cy + labelR * Math.sin(angle);

                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', lx);
                text.setAttribute('y', ly);
                text.setAttribute('text-anchor', 'middle');
                text.setAttribute('dominant-baseline', 'central');
                text.setAttribute('fill', '#374151');
                text.setAttribute('font-size', '10');
                text.setAttribute('font-family', 'FusionPixel, PingFang SC, sans-serif');
                text.textContent = dimensions[i];
                svg.appendChild(text);

                // 分数标签（用维度颜色）
                const scoreR = maxR + 28;
                const sx = cx + scoreR * Math.cos(angle);
                const sy = cy + scoreR * Math.sin(angle);

                const scoreText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                scoreText.setAttribute('x', sx);
                scoreText.setAttribute('y', sy);
                scoreText.setAttribute('text-anchor', 'middle');
                scoreText.setAttribute('dominant-baseline', 'central');
                scoreText.setAttribute('fill', colors[i]);
                scoreText.setAttribute('font-size', '10');
                scoreText.setAttribute('font-weight', '600');
                scoreText.setAttribute('font-family', 'FusionPixel, PingFang SC, sans-serif');
                scoreText.textContent = values[i].toFixed(2);
                svg.appendChild(scoreText);
            }

            // 数据多边形
            const fillPoints = values.map((v, i) => {
                const p = pointCoords(i, v);
                return `${p.x},${p.y}`;
            }).join(' ');

            const fillPolygon = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
            fillPolygon.setAttribute('points', fillPoints);
            fillPolygon.setAttribute('fill', 'rgba(244,114,182,0.15)');
            fillPolygon.setAttribute('stroke', '#f472b6');
            fillPolygon.setAttribute('stroke-width', '2');
            svg.appendChild(fillPolygon);

            // 数据点
            values.forEach((v, i) => {
                const p = pointCoords(i, v);
                const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                circle.setAttribute('cx', p.x);
                circle.setAttribute('cy', p.y);
                circle.setAttribute('r', '4');
                circle.setAttribute('fill', colors[i]);
                circle.setAttribute('stroke', '#fff');
                circle.setAttribute('stroke-width', '2');
                svg.appendChild(circle);
            });

            container.appendChild(svg);
        }

        // ===== 加载 Projects =====
        async function loadProjects() {
            try {
                // 本地缓存
                const cached = localStorage.getItem('projects_cache');
                if (cached) {
                    const parsed = JSON.parse(cached);
                    if (Date.now() - parsed.timestamp < CACHE_TTL) {
                        renderProjects(parsed.repos);
                        return;
                    }
                }

                const res = await fetch(`https://api.github.com/users/${GITHUB_USERNAME}/repos?sort=updated&per_page=50`, {
                    headers: { 'Accept': 'application/vnd.github.v3+json' }
                });
                if (!res.ok) {
                    throw new Error(`GitHub API ${res.status}: ${res.statusText}`);
                }
                const repos = await res.json();
                localStorage.setItem('projects_cache', JSON.stringify({ timestamp: Date.now(), repos }));
                renderProjects(repos);
            } catch (e) {
                document.getElementById('repoList').innerHTML = '<div class="error-text">Failed to load projects.</div>';
                console.error('Projects error:', e);
            }
        }

        function renderProjects(repos) {
            const list = document.getElementById('repoList');

            if (!repos.length) {
                list.innerHTML = '<div class="error-text">No repositories found.</div>';
                return;
            }

            list.innerHTML = repos.slice(0, 10).map(repo => `
                    <div class="repo-item">
                        <div class="repo-header">
                            <a class="repo-name" href="${repo.html_url}" target="_blank">${repo.name}</a>
                        </div>
                        <div class="repo-desc">${repo.description || 'No description'}</div>
                        <div class="repo-stats">
                            <span>
                                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .587l3.668 7.568 8.332 1.151-6.064 5.828 1.48 8.279-7.416-3.967-7.417 3.967 1.481-8.279-6.064-5.828 8.332-1.151z"/></svg>
                                ${repo.stargazers_count}
                            </span>
                            <span>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7M17 7H7M17 7v10"/></svg>
                                ${repo.forks_count}
                            </span>
                            <span>${new Date(repo.updated_at).toLocaleDateString()}</span>
                        </div>
                    </div>
                `).join('');
        }

        // ===== 加载 Thinking =====
        async function loadThinking() {
            try {
                const res = await fetch('/thinking/list.md');
                const md = await res.text();
                const entries = md.split(/^## /m).slice(1);
                const list = document.getElementById('thinkingList');

                list.innerHTML = entries.map(entry => {
                    const lines = entry.split('\n');
                    const header = lines[0].trim();
                    const linkMatch = header.match(/\[(.+?)\]\((.+?)\)/);
                    const title = linkMatch ? linkMatch[1] : header;
                    const url = linkMatch ? linkMatch[2] : '';
                    const dateMatch = title.match(/^(\d{4}-\d{2}-\d{2})\s*(.*)/);
                    const date = dateMatch ? dateMatch[1] : '';
                    const preview = lines.slice(1, 4).join(' ').trim().substring(0, 150);

                    return `
                        <div class="thinking-entry">
                            <div class="thinking-date">${date}</div>
                            <div class="thinking-title"><a href="${url}">${title}</a></div>
                            <div class="thinking-preview">${preview}${preview.length >= 150 ? '...' : ''}</div>
                        </div>
                    `;
                }).join('');
            } catch (e) {
                document.getElementById('thinkingList').innerHTML = '<div class="error-text">Failed to load thinking.</div>';
                console.error('Thinking error:', e);
            }
        }

        // ===== 更新时间 =====
        function updateFooterTime() {
            const el = document.getElementById('update-time');
            if (el) {
                el.textContent = '数据最后更新于 ' + new Date(document.lastModified).toLocaleDateString('zh-CN');
            }
        }

        // ===== 初始化 =====
        document.addEventListener('DOMContentLoaded', () => {
            updateFooterTime();
            loadBasis();
            loadLinks();
            loadScl90();
            loadProjects();
            loadThinking();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thinking - Hanguang Xingchen</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.0.0/dist/markdown-it.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it-footnote@4.0.0/dist/markdown-it-footnote.min.js"></script>
    <style>
        .article-body { max-width: 720px; margin: 0 auto; padding: 0 0 40px 0; }
        .article-body h1 { font-size: 1.8rem; margin-bottom: 8px; color: var(--pink-600); }
        .article-body h2 { font-size: 1.3rem; margin: 32px 0 12px; color: var(--pink-500); border-bottom: 1px solid var(--pink-200); padding-bottom: 4px; }
        .article-body h3 { font-size: 1.1rem; margin: 24px 0 8px; color: var(--text-primary); }
        .article-body p { margin: 12px 0; line-height: 1.8; }
        .article-body table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 0.85rem; }
        .article-body th, .article-body td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; }
        .article-body th { background: var(--pink-50); font-weight: 600; }
        .article-body blockquote { border-left: 3px solid var(--pink-300); padding-left: 12px; color: var(--text-secondary); margin: 12px 0; }
        .article-body .footnotes { margin-top: 32px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 0.8rem; color: var(--text-tertiary); }
        .article-body a { color: var(--pink-500); text-decoration: none; position: relative; }
        .article-body a::after { content: ''; position: absolute; left: 0; bottom: -1px; width: 0; height: 1px; background: var(--pink-500); transition: width 0.3s ease; }
        .article-body a:hover::after { width: 100%; }
        .article-body code { background: var(--pink-50); padding: 2px 6px; font-size: 0.85rem; color: var(--pink-600); }
        .article-body pre { background: var(--gray-800); color: #f9fafb; padding: 16px; overflow-x: auto; font-size: 0.8rem; }
        .article-body pre code { background: none; color: inherit; padding: 0; }
        .article-body ul, .article-body ol { margin: 12px 0; padding-left: 24px; }
        .article-body li { margin: 4px 0; line-height: 1.7; }
        .article-body strong { color: var(--pink-600); }
        .article-body em { color: var(--text-secondary); }
        .article-body del { color: var(--text-tertiary); }
        .article-body hr { border: none; border-top: 1px solid var(--pink-200); margin: 32px 0; }
        .article-body img { max-width: 100%; height: auto; }
        .thinking-index a { color: var(--pink-500); text-decoration: none; }
        .thinking-index a:hover { text-decoration: underline; }
        .thinking-index h2 { font-size: 1.1rem; margin: 16px 0 8px; }
        .thinking-index p { font-size: 0.85rem; color: var(--text-secondary); margin: 0 0 16px 0; }
        .back-link { display: inline-block; margin-top: 40px; color: var(--pink-500); text-decoration: none; font-size: 0.85rem; }
        .back-link:hover { text-decoration: underline; }

        /* ===== GFM Alerts（[!NOTE] 等） ===== */
        .gfm-alert { padding: 12px 16px; margin: 16px 0; border-left: 4px solid var(--gray-400); background: var(--gray-50); }
        .gfm-alert-title { font-weight: 700; font-size: 0.85rem; margin-bottom: 4px; }
        .gfm-alert-body { font-size: 0.9rem; line-height: 1.6; }
        .gfm-alert-note { border-left-color: #0969da; background: #ddf4ff; }
        .gfm-alert-note .gfm-alert-title { color: #0969da; }
        .gfm-alert-tip { border-left-color: #1a7f37; background: #dafbe1; }
        .gfm-alert-tip .gfm-alert-title { color: #1a7f37; }
        .gfm-alert-important { border-left-color: #8250df; background: #f5f0ff; }
        .gfm-alert-important .gfm-alert-title { color: #8250df; }
        .gfm-alert-warning { border-left-color: #bf4800; background: #fff8c5; }
        .gfm-alert-warning .gfm-alert-title { color: #bf4800; }
        .gfm-alert-caution { border-left-color: #cf222e; background: #ffebe9; }
        .gfm-alert-caution .gfm-alert-title { color: #cf222e; }
        .gfm-alert-info { border-left-color: #0550ae; background: #e8f0fe; }
        .gfm-alert-info .gfm-alert-title { color: #0550ae; }

        /* ===== Obsidian Spoilers ===== */
        .article-body mark {
            background: var(--gray-200);
            color: var(--gray-200);
            padding: 0 4px;
            border-radius: 2px;
            transition: color 0.2s, background 0.2s;
            cursor: help;
        }
        .article-body mark:hover {
            background: var(--pink-100);
            color: var(--text-primary);
        }

        .thinking-loading { text-align: center; color: var(--text-tertiary); padding: 40px 0; }
    </style>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <img class="sidebar-avatar" src="/imgs/avatar.webp" alt="avatar"
                     onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect fill=%22%23fbcfe8%22 width=%22100%22 height=%22100%22/><text x=%2250%22 y=%2260%22 text-anchor=%22middle%22 font-size=%2250%22 fill=%22%23db2777%22>HX</text></svg>'" />
                <div class="sidebar-name" id="sidebarName">Loading...</div>
            </div>
            <div class="sidebar-bio" id="sidebarBio">加载个人介绍...</div>
        </aside>

        <main class="main-content">
            <section class="section">
                <div class="section-header">
                    <span class="section-title" id="pageTitle">Thinking</span>
                    <a href="/" class="section-link">← 返回主页</a>
                </div>
                <div id="thinkingContent">
                    <div class="thinking-loading">加载中...</div>
                </div>
            </section>
            <footer class="footer">
                <span>Designed by Hanguang & Qwen & DeepSeek</span>
                <span class="footer-center" id="update-time">Loading...</span>
                <a href="https://github.com/hanguang-xingchen/hanguang-xingchen.github.io" target="_blank">Source on GitHub</a>
            </footer>
        </main>
    </div>

    <script>
        const md = window.markdownit({
            html: true,
            breaks: false,
            linkify: true,
            typographer: true,
        }).use(window.markdownitFootnote);

        // 预处理：转换 Obsidian spoiler 语法 >!text!< 为 <mark> 标签
        function preprocessSpoilers(text) {
            return text.replace(/>!(.*?)!</gs, '<mark>$1</mark>');
        }

        // 后处理：转换 markdown-it 渲染后的 [!NOTE] blockquotes 为 styled alerts
        function postprocessAlerts(html) {
            // 匹配包含 [!TYPE] 的 blockquote
            return html.replace(
                /<blockquote>\s*<p>\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION|INFO)\]\s*(.*?)<\/p>([\s\S]*?)<\/blockquote>/gi,
                (match, type, firstLine, rest) => {
                    const typeLower = type.toLowerCase();
                    const icons = { note: '💬', tip: '💡', important: 'ℹ️', warning: '⚠️', caution: '🚨', info: 'ℹ️' };
                    const titles = { note: 'Note', tip: 'Tip', important: 'Important', warning: 'Warning', caution: 'Caution', info: 'Info' };
                    const icon = icons[typeLower] || '💬';
                    const title = titles[typeLower] || 'Note';
                    const content = rest.replace(/^<p>|<\/p>$/g, '').trim();
                    const firstContent = firstLine.replace(/\*\*/?/g, '').trim();
                    return `<div class="gfm-alert gfm-alert-${typeLower}">
                        <div class="gfm-alert-title">${icon} ${title}</div>
                        <div class="gfm-alert-body">${firstContent}${content}</div>
                    </div>`;
                }
            );
        }

        // 合并渲染管线
        function renderMarkdown(mdText) {
            const cleaned = preprocessSpoilers(mdText);
            const html = md.render(cleaned);
            return postprocessAlerts(html);
        }

        // 加载个人信息
        async function loadBasis() {
            try {
                const res = await fetch('/info/basis.json');
                const data = await res.json();
                document.getElementById('sidebarName').textContent = data.name;
                document.getElementById('sidebarBio').textContent = data.bio;
                document.title = `Thinking - ${data.name}`;
            } catch (e) {
                console.warn('Failed to load basis:', e);
            }
        }

        // 渲染文章列表（解析 index.md）
        async function renderList() {
            const container = document.getElementById('thinkingContent');
            try {
                const res = await fetch('/thinking/list.md');
                if (!res.ok) throw new Error('Failed to fetch');
                const mdText = await res.text();

                const entries = mdText.split(/^## /m).slice(1);
                let html = '<div class="thinking-index">';

                entries.forEach(entry => {
                    const lines = entry.split('\n');
                    const header = lines[0].trim();
                    const linkMatch = header.match(/\[(.+?)\]\((.+?)\)/);
                    const title = linkMatch ? linkMatch[1] : header;
                    const url = linkMatch ? linkMatch[2] : '';
                    const dateMatch = title.match(/^(\d{4}-\d{2}-\d{2})\s*(.*)/);
                    const date = dateMatch ? dateMatch[1] : '';
                    const shortTitle = dateMatch ? dateMatch[2] : title;
                    const preview = lines.slice(1, 4).join(' ').trim().substring(0, 150);

                    // 把 /thinking/?article=xxx 链接保持原样
                    const newUrl = url.startsWith('/thinking/?') ? url : `/thinking/?article=${encodeURIComponent(url.replace('/thinking/', ''))}`;

                    html += `
                        <div class="thinking-entry">
                            <div class="thinking-date">${date}</div>
                            <div class="thinking-title"><a href="${newUrl}">${title}</a></div>
                            <div class="thinking-preview">${preview}${preview.length >= 150 ? '...' : ''}</div>
                        </div>
                    `;
                });
                
                html += '</div>';
                container.innerHTML = html;
            } catch (e) {
                container.innerHTML = '<div class="error-text">Failed to load thinking list.</div>';
                console.error('Thinking list error:', e);
            }
        }

        // 渲染单篇文章
        async function renderArticle(articleSlug) {
            const container = document.getElementById('thinkingContent');
            const pageTitle = document.getElementById('pageTitle');
            
            try {
                const res = await fetch(`/thinking/${articleSlug}.md`);
                if (!res.ok) throw new Error('Article not found');
                const mdText = await res.text();
                
                const html = renderMarkdown(mdText);
                container.innerHTML = `<div class="article-body">${html}<a class="back-link" href="/thinking/">← 返回 Thinking 列表</a></div>`;
                
                // 更新标题
                const titleMatch = mdText.match(/^#\s+(.+)$/m);
                if (titleMatch) {
                    pageTitle.textContent = titleMatch[1];
                    document.title = `${titleMatch[1]} - Thinking`;
                }
            } catch (e) {
                container.innerHTML = `<div class="error-text">Failed to load article "${articleSlug}".</div>`;
                console.error('Article error:', e);
            }
        }

        // 更新时间
        function updateFooterTime() {
            const el = document.getElementById('update-time');
            if (el) {
                el.textContent = '数据最后更新于 ' + new Date(document.lastModified).toLocaleDateString('zh-CN');
            }
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            updateFooterTime();
            loadBasis();
            
            const params = new URLSearchParams(window.location.search);
            const article = params.get('article');
            
            if (article) {
                renderArticle(article);
            } else {
                renderList();
            }
        });
    </script>
</body>
</html>

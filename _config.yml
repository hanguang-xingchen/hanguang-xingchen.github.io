# Site settings
title: Hanguang Xingchen
description: 涵光新辰的个人网站
baseurl: ""
url: "https://hanguang-xingchen.github.io"

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# Permalinks
permalink: /:path/

# 排除不需要 Jekyll 构建的文件
exclude:
  - thinking/index.html
  - thinking/list.md
  - node_modules/
  - vendor/

# 默认布局
defaults:
  - scope:
      path: "thinking"
    values:
      layout: "thinking"
